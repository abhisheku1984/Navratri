name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch should supersede a run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Scripture integrity first: it is the cheapest gate and the one whose
      # failure means the shipped content is wrong rather than merely broken.
      - name: Verify scripture content
        run: npm run verify:scripture

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # The build must succeed with no provider configured: retrieval-only
          # Devi Gyan is the shipped default, not a degraded fallback.
          NEXT_TELEMETRY_DISABLED: 1
